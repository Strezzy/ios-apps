name: Build and verify Rift for iPhone
on:
  workflow_dispatch:
  push:
    branches: [main, rift-v1]
    paths: ['Rift/**', '.github/workflows/rift-build.yml']
permissions:
  contents: write
concurrency:
  group: rift-native-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RIFT_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare native tools
        id: tools
        run: |
          xcodebuild -version
          sysctl hw.memsize hw.ncpu
          echo "xcode=$(xcodebuild -version | tr '\n ' '-')" >> "$GITHUB_OUTPUT"
          python -m pip install Pillow==11.1.0
          if ! command -v xcodegen; then brew install xcodegen; fi
          if ! command -v cmake; then brew install cmake; fi
          if ! xcrun metal --version; then xcodebuild -downloadComponent MetalToolchain; fi
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: Rift/Build/Native
          key: rift-native-8345f333-v1-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}
      - name: Prepare approved artwork, source and pinned uncensored catalog
        run: python Rift/scripts/build.py prepare
      - name: Build real simulator, iPhone Metal and macOS inference runtimes
        id: native
        run: python Rift/scripts/build.py native
      - name: Keep completed native runtimes even when a later test fails
        uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: Rift/Build/Native
          key: rift-native-8345f333-v1-${{ runner.arch }}-${{ steps.tools.outputs.xcode }}
      - name: Compile SwiftUI app and run native core, animation and UI tests
        run: python Rift/scripts/build.py simulator
      - name: Compile arm64 iPhone application
        run: python Rift/scripts/build.py iphone
      - name: Run actual local CPU inference for every curated model
        run: python Rift/scripts/build.py smoke
      - name: Verify and package IPA
        run: python Rift/scripts/build.py package
      - name: Preserve exact source and diagnostic evidence
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          from PIL import Image
          root=pathlib.Path('Rift'); out=root/'Verification'; out.mkdir(exist_ok=True)
          for name in ['BUILD-REPORT.json','MODEL-SMOKE.json','catalog-resolution.json']:
            p=root/'Build'/name
            if p.exists(): (out/name).write_bytes(p.read_bytes())
          (out/'HOST.txt').write_text(subprocess.check_output(['sysctl','hw.memsize','hw.ncpu'],text=True))
          errors=[]
          for p in (root/'Build/Logs').glob('*.log'):
            lines=p.read_text(errors='replace').splitlines()
            matched=[s for s in lines if 'error:' in s.lower() or 'failed' in s.lower() or 'traceback' in s.lower()]
            if matched: errors += [p.name]+matched[-30:]
          (out/'BUILD-ERRORS.txt').write_text('\n'.join(errors)[-25000:])
          for p in (root/'Build/Screenshots').rglob('*.png'):
            image=Image.open(p).convert('RGB'); image.thumbnail((440,956))
            image.save(out/(p.stem+'.webp'),quality=75)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Rift/Rift Rift/project.yml Rift/scripts/prepare.py Rift/Verification
          if test -f Rift/RECOVERY-APPLIED; then git add Rift/RECOVERY-APPLIED; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve Rift build source and native verification evidence [skip ci]'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
      - name: Preserve the real IPA and full build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Rift-iPhone
          path: |
            Rift/Build/Rift.ipa
            Rift/Build/Rift-Source.zip
            Rift/Build/BUILD-REPORT.json
            Rift/Build/MODEL-SMOKE.json
            Rift/Build/catalog-resolution.json
            Rift/Build/Screenshots
            Rift/Build/Logs
          if-no-files-found: warn
          retention-days: 14
