name: Repair Loop SAM iOS decoder
on:
  push:
    branches: ['feature/loop-simple-power-2.0']
    paths: ['.github/workflows/loop2-repair-sam.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: xcode-27
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Repair and compare real portrait inference
        run: |
          set -euo pipefail
          python -m pip install -q coremltools==8.3.0 numpy pillow
          python -u - <<'PY'
          import coremltools as ct,numpy as np,shutil,hashlib,json,os
          from pathlib import Path
          from PIL import Image
          root=Path('Loop/Resources/SceneModels');package=root/'SAM2TinyMaskDecoderFLOAT16.mlpackage'
          original=Path(os.environ['RUNNER_TEMP'])/'OriginalDecoder.mlpackage';shutil.copytree(package,original)
          spec=ct.models.MLModel(str(package),skip_model_load=True).get_spec();count=0
          def repair(block):
              global count
              for op in block.operations:
                  if op.type=='conv_transpose' and 'output_shape' in op.inputs:
                      print('Removing redundant output shape:',op.outputs[0].name)
                      del op.inputs['output_shape'];count+=1
                  for nested in op.blocks:repair(nested)
          for f in spec.mlProgram.functions.values():
              for b in f.block_specializations.values():repair(b)
          assert count>0,count
          proto=next(package.rglob('*.mlmodel'));before=hashlib.sha256(proto.read_bytes()).hexdigest();proto.write_bytes(spec.SerializeToString())
          def load(p):return ct.models.MLModel(str(p),compute_units=ct.ComputeUnit.CPU_AND_GPU)
          old,new=load(original),load(package)
          enc=load(root/'SAM2TinyImageEncoderFLOAT16.mlpackage');prompt=load(root/'SAM2TinyPromptEncoderFLOAT16.mlpackage')
          image=Image.open('Loop/Tests/Fixtures/portrait-fixture.png').convert('RGB').resize((1024,1024))
          features=enc.predict({'image':image});results=[]
          for coords,labels in [([(512,665.6)],[1]), ([(430.08,327.68),(256,563.2),(20.48,20.48),(757.76,1003.52)],[1,1,2,3])]:
              pf=prompt.predict({'points':np.array([coords],dtype=np.float16),'labels':np.array([labels],dtype=np.float16)})
              inputs=dict(features,sparse_embedding=pf['sparse_embeddings'],dense_embedding=pf['dense_embeddings'])
              a,b=old.predict(inputs),new.predict(inputs)
              am,bm=a['low_res_masks'].astype(np.float32),b['low_res_masks'].astype(np.float32)
              pa,pb=1/(1+np.exp(-np.clip(am,-40,40))),1/(1+np.exp(-np.clip(bm,-40,40)))
              fgA,fgB=am>0,bm>0
              union=np.logical_or(fgA,fgB).sum();iou=float(np.logical_and(fgA,fgB).sum()/max(1,union))
              mae=float(np.abs(pa-pb).mean());score=float(np.abs(a['scores'].astype(np.float32)-b['scores'].astype(np.float32)).max())
              result={'points':len(coords),'maskIoU':iou,'meanProbabilityError':mae,'maximumLogitError':float(np.abs(am-bm).max()),'maximumScoreError':score}
              print('Portrait parity',result);results.append(result)
              assert iou>.99 and mae<.002 and score<.005,result
              assert am.max()-am.min()>1 and bm.max()-bm.min()>1
          report={'change':'Remove redundant conv_transpose output_shape operands; spatial size is inferred from unchanged convolution weights, padding and strides.','operations':count,'originalModelSHA256':before,'modifiedModelSHA256':hashlib.sha256(proto.read_bytes()).hexdigest(),'macOSPortraitParity':results}
          (root/'SAM-IOS-REPAIR.json').write_text(json.dumps(report,indent=2)+'\n')
          manifest=json.loads((root/'SCENE-MODELS.json').read_text())
          for m in manifest['models']:
              for f in m['files']:f['sha256']=hashlib.sha256((root/f['path']).read_bytes()).hexdigest()
              if any('SAM2TinyMaskDecoder' in f['path'] for f in m['files']):m['localCompatibilityPatch']='SAM-IOS-REPAIR.json'
          (root/'SCENE-MODELS.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
      - name: Prepare iOS inference verification
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,textwrap
          from pathlib import Path
          raw=Path('.github/workflows/loop2-model-probe.yml').read_text()
          s=textwrap.dedent(raw.split('<<\'SWIFT\'\n',1)[1].split('\n          SWIFT',1)[0]);root=Path.cwd()
          s=s.replace('FileManager.default.currentDirectoryPath','"'+str(root)+'"')
          s=s.replace('URL(fileURLWithPath:"Loop/Tests/Fixtures/portrait-fixture.png")','URL(fileURLWithPath:"'+str(root/'Loop/Tests/Fixtures/portrait-fixture.png')+'")')
          s=s.replace('[MLComputeUnits.cpuAndGPU,MLComputeUnits.all]','[MLComputeUnits.cpuAndGPU]')
          s=s.replace('for count in [1,2,4,14]','for count in [4,1]')
          s=s.replace('for compact in [false,true]','for compact in [true]')
          s=s.replace('for i in 0..<a.count {let v=a[i].doubleValue;','for i in stride(from:0,to:a.count,by:max(1,a.count/20000)) {let v=a[i].doubleValue;')
          s=s.replace('for c in 0..<a.shape[1].intValue {print("MASKPOINT",c,a[[0,NSNumber(value:c),166,128]])}', 'var lo=Double.infinity,hi = -Double.infinity;for i in stride(from:0,to:a.count,by:19){let v=a[i].doubleValue;lo=min(lo,v);hi=max(hi,v)};precondition(hi-lo>1,"iOS mask must be nonconstant");print("IOS_MASK_VALID",count,lo,hi)')
          Path(os.environ['RUNNER_TEMP']+'/repaired.swift').write_text(s)
          PY
          xcrun swiftc -O -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target arm64-apple-ios26.0-simulator "$RUNNER_TEMP/repaired.swift" -o "$RUNNER_TEMP/repaired"
      - name: Verify real iOS mask inference
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,subprocess,os
          d=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          keys=sorted([k for k in d['devices'] if 'iOS' in k],key=lambda k:tuple(map(int,re.findall(r'\d+',k))),reverse=True)
          chosen=next(x for x in d['devices'][keys[0]] if 'iPhone' in x['name'] and x.get('isAvailable'));udid=chosen['udid']
          subprocess.run(['xcrun','simctl','boot',udid]);subprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True,timeout=180)
          with open(os.environ['RUNNER_TEMP']+'/sam-repair-ios.log','w') as f:
              p=subprocess.run(['xcrun','simctl','spawn',udid,os.environ['RUNNER_TEMP']+'/repaired'],stdout=f,stderr=subprocess.STDOUT,timeout=180)
          log=open(os.environ['RUNNER_TEMP']+'/sam-repair-ios.log').read();print(log);p.check_returncode()
          assert log.count('IOS_MASK_VALID')==2,log
          PY
      - name: Save the verified decoder repair
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/sam-repair-ios.log" Loop/Resources/SceneModels/SAM-IOS-REPAIR.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loop/Resources/SceneModels
          git commit -m 'Repair SAM decoder shape inference with verified iOS output and portrait parity'
          git push origin HEAD:feature/loop-simple-power-2.0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Loop-SAM-iOS-Repair-Evidence
          path: |
            ${{ runner.temp }}/sam-repair-ios.log
            Loop/Resources/SceneModels/SAM-IOS-REPAIR.json
