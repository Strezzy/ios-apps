name: Build and publish Depth Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DepthCheck/**'
      - '.github/workflows/depth-check.yml'

permissions:
  contents: write

concurrency:
  group: depth-check-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build, test and launch the native app
        env:
          DEPTHCHECK_BUILD_NUMBER: ${{ github.run_number }}
        run: python3 DepthCheck/scripts/build_ios.py
      - name: Store the verified iPhone build
        uses: actions/upload-artifact@v7
        with:
          name: DepthCheck-iPhone
          path: |
            DepthCheck/Build/DepthCheck.ipa
            DepthCheck/Build/BUILD-REPORT.json
            DepthCheck/Build/Simulator-Launch.png
          if-no-files-found: error
          retention-days: 30
      - name: Publish the downloadable IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: depth-check-1.0-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" DepthCheck/Build/DepthCheck.ipa DepthCheck/Build/BUILD-REPORT.json DepthCheck/Build/Simulator-Launch.png --target "$GITHUB_SHA" --title "Depth Check 1.0 (${{ github.run_number }})" --notes-file DepthCheck/RELEASE-NOTES.md
      - name: Add the verified release to Strezzy's Apps
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: depth-check-1.0-${{ github.run_number }}
        run: |
          git fetch origin main
          git restore DepthCheck/DepthCheck/Info.plist DepthCheck/DepthCheck.xcodeproj/project.pbxproj
          git rebase origin/main
          python3 scripts/update_catalog.py --tag "$RELEASE_TAG" --local DepthCheck/Build/DepthCheck.ipa --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes "Depth Check 1.0: local photo and video depth conversion, full-resolution stereo exports, source video timing, native Liquid Glass. See the release notes for validation details."
          git add apps.json README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified Depth Check release to app source"
          git push origin HEAD:main
      - name: Store build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DepthCheck-Build-Evidence
          path: |
            DepthCheck/Build/Logs
            DepthCheck/Build/TestResults.xcresult
            DepthCheck/Build/BUILD-REPORT.json
            DepthCheck/Build/Simulator-Launch.png
          if-no-files-found: ignore
          retention-days: 14
