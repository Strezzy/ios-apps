name: Prepare Loop realism assets
on:
  push:
    branches: ['feature/loop-realism-1.3']
    paths: ['.github/loop-realism-1.3/prepare_assets.py', '.github/workflows/loop-realism-assets.yml']
permissions:
  contents: write
concurrency:
  group: loop-realism-assets
  cancel-in-progress: true
jobs:
  assets:
    runs-on: xcode-27
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 torchvision==0.20.1 coremltools==8.3.0 numpy==1.26.4 Pillow==11.1.0 gdown==5.2.0 requests==2.32.3 opencv-python-headless==4.11.0.86
      - name: Convert models, run native model parity checks, and prepare CC0 photographs
        run: python .github/loop-realism-1.3/prepare_assets.py
      - name: Save verified resources on the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loop/Resources
          git commit -m 'Bundle validated Core ML portrait models and six CC0 photographic backdrops'
          git pull --rebase origin feature/loop-realism-1.3
          git push origin HEAD:feature/loop-realism-1.3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Loop-Realism-Resources
          path: |
            Loop/Resources/RealismAssets.json
            Loop/Resources/RealismLicenses
            Loop/Resources/RealismBackdrops
          retention-days: 14
