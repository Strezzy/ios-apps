name: Publish verified Rift recovery build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Rift recovery build run ID
        required: true
        type: string
      source_sha:
        description: Exact source commit tested by that build
        required: true
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: rift-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Strezzy/ios-apps
      RIFT_RUN_ID: ${{ inputs.run_id }}
      RIFT_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, publish and update only the Rift catalog entry
        run: |
          python3 -m py_compile scripts/publish_rift_recovery.py
          python3 scripts/publish_rift_recovery.py
