name: Publish completed Rift build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/rift-publish-ready.yml']
permissions:
  contents: write
concurrency:
  group: app-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: Strezzy/ios-apps
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Publish the verified uploaded release and finish the catalog
        run: |
          python3 - <<'PY'
          import copy, hashlib, json, os, re, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath
          ROOT = Path.cwd()
          OUT = Path(os.environ['RUNNER_TEMP']) / 'RiftRelease10'
          OUT.mkdir(parents=True, exist_ok=True)
          REPO = 'Strezzy/ios-apps'
          TAG = 'rift-1.0-build10'
          SOURCE = '8061df14caac05e62dc9c454f2b135efd1c75b21'
          HASHES = {
              'Rift.ipa': 'f8171166137d602d4f0ab275222f60bfe678cdbba3c5c594e76b6c09bb820860',
              'Rift-Source.zip': '7e5ef688312d9245e0cc4d147a631e8463fa5b243586108a6ea99291dbbe4459',
              'BUILD-REPORT.json': '12f0189c349e1833b56a68f8036771b0f70e3c8ea228e44e182fbdf4f8cdad0a',
              'MODEL-SMOKE.json': 'b7115910e7e5d07c812bab50278c7c59e4bf7d7be3138ace72591c5ca8fdb49b',
          }
          def cmd(*args):
              return subprocess.check_output([str(a) for a in args], text=True).strip()
          def api(path):
              return json.loads(cmd('gh', 'api', f'repos/{REPO}/{path}'))
          def sha(path):
              with Path(path).open('rb') as handle:
                  return hashlib.file_digest(handle, 'sha256').hexdigest()
          # Draft releases are resolved through the CLI, not the published-tag API.
          existing = json.loads(cmd('gh', 'release', 'view', TAG, '--repo', REPO, '--json', 'isDraft,body,url'))
          cmd('gh', 'release', 'download', TAG, '--repo', REPO, '--dir', OUT)
          for name, digest in HASHES.items():
              assert sha(OUT / name) == digest, f'Release asset identity mismatch: {name}'
          report = json.loads((OUT / 'BUILD-REPORT.json').read_text())
          assert report['source'] == SOURCE and report['build'] == '10'
          assert report['test_summary']['passedTests'] == 29
          assert report['test_summary']['failedTests'] == 0
          (OUT / 'SOURCE-REVISION.txt').write_text(SOURCE + '\n')
          sys.path.insert(0, str(ROOT / 'scripts'))
          from publish_rift import verify
          _, ipa, models, source = verify(OUT)
          assert source == SOURCE and len(models) == 6
          # The tested app source was preserved on main in the previous step.
          with zipfile.ZipFile(OUT / 'Rift-Source.zip') as archive:
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  assert path.parts and path.parts[0] == 'Rift'
                  assert not path.is_absolute() and '..' not in path.parts
                  if entry.is_dir() or 'Verification' in path.parts:
                      continue
                  assert sha(ROOT.joinpath(*path.parts)) == hashlib.sha256(archive.read(entry)).hexdigest(), f'Source differs: {entry.filename}'
          snapshot = cmd('git', 'rev-parse', 'HEAD')
          assert api('git/ref/heads/main')['object']['sha'] == snapshot
          notes = re.sub(r'^Publication snapshot: .+$', 'Publication snapshot: ' + snapshot, existing['body'], flags=re.MULTILINE)
          (OUT / 'RELEASE-NOTES.md').write_text(notes)
          if existing['isDraft']:
              cmd('gh', 'release', 'edit', TAG, '--repo', REPO, '--target', snapshot, '--notes-file', OUT / 'RELEASE-NOTES.md', '--draft=false')
          release = api('releases/tags/' + TAG)
          assert not release['draft'] and not release['prerelease']
          asset = next(a for a in release['assets'] if a['name'] == 'Rift.ipa')
          assert asset['size'] == report['ipa_bytes'] and asset['state'] == 'uploaded'
          assert asset['digest'] == 'sha256:' + HASHES['Rift.ipa']
          print('Public IPA verified:', asset['browser_download_url'], flush=True)
          from update_catalog import update, render_readme
          registry = json.loads((ROOT / 'app-registry.json').read_text())
          metadata = registry['com.billy.rift']
          catalog = json.loads((ROOT / 'apps.json').read_text())
          others = copy.deepcopy([app for app in catalog['apps'] if app['bundleIdentifier'] != 'com.billy.rift'])
          old = next((app for app in catalog['apps'] if app['bundleIdentifier'] == 'com.billy.rift'), None)
          isolated = {'apps': [copy.deepcopy(old)] if old else []}
          update(isolated, {'com.billy.rift': metadata}, [ipa], TAG, release['published_at'], release['body'])
          catalog['apps'] = others + isolated['apps']
          assert [app for app in catalog['apps'] if app['bundleIdentifier'] != 'com.billy.rift'] == others
          (ROOT / 'apps.json').write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n')
          render_readme(catalog)
          cmd('git', 'config', 'user.name', 'github-actions[bot]')
          cmd('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          cmd('git', 'add', 'apps.json', 'README.md')
          changed = subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode
          if changed == 1:
              cmd('git', 'commit', '-m', 'Publish Rift 1.0 (10) in the app source and download page [skip ci]')
              cmd('git', 'push', 'origin', 'HEAD:main')
          elif changed != 0:
              raise RuntimeError('Cannot inspect staged catalog changes')
          print('PUBLISHED:', release['html_url'], flush=True)
          print('CATALOG UPDATED:', 'https://raw.githubusercontent.com/' + REPO + '/main/apps.json', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'## Rift published\n\n[Release]({release["html_url"]}) · [Download IPA]({asset["browser_download_url"]})\n\n29 native tests and all six model checks passed. Physical-iPhone and LiveContainer testing remain pending.\n')
          PY
