name: Diagnose Loop scene selection
on:
  push:
    branches: ['feature/loop-simple-power-2.0']
    paths: ['.github/loop2-diagnostics/**', '.github/workflows/loop2-model-diagnostics.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Evaluate the actual pinned model components
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sam-review"
          cp .github/loop2-diagnostics/sam.swift "$RUNNER_TEMP/sam-review/sam.swift"
          swiftc "$RUNNER_TEMP/sam-review/sam.swift" -o "$RUNNER_TEMP/sam-review/check"
          curl -fL --retry 3 https://raw.githubusercontent.com/scikit-image/scikit-image/v0.19.3/skimage/data/astronaut.png -o "$RUNNER_TEMP/sam-review/fixture.png"
          cd "$RUNNER_TEMP/sam-review"
          ./check "$GITHUB_WORKSPACE/Loop/Resources/SceneModels" fixture.png 2>&1 | tee diagnosis.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Loop-SAM2-Native-Diagnostics
          path: |
            ${{ runner.temp }}/sam-review/*.log
            ${{ runner.temp }}/sam-review/*.png
