name: Publish Loop 1.3 realism overhaul
on:
  push:
    branches: ['feature/loop-realism-1.3']
    paths: ['.github/loop-realism-1.3/part*.b64', '.github/loop-realism-1.3/fixes.py', '.github/workflows/loop-realism-1.3.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: loop-realism-publication
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Integrate only Loop changes against current main
        run: |
          set -euo pipefail
          cp -R .github/loop-realism-1.3 "$RUNNER_TEMP/loop-realism-source"
          mkdir -p "$RUNNER_TEMP/loop-realism-assets"
          cp -R Loop/Resources/Realism* "$RUNNER_TEMP/loop-realism-assets/"
          git fetch origin main
          git switch -c "loop/realism-candidate-$GITHUB_RUN_ID" origin/main
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,shutil
          from pathlib import Path
          staging=Path(os.environ['RUNNER_TEMP'])/'loop-realism-source'
          raw=lzma.decompress(base64.b64decode(''.join((staging/f'part{i}.b64').read_text().strip() for i in range(3)),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='92fc7634785307d626af87a7df0e218f46f3a340fed479d23a124497b1e7fa47'
          payload=json.loads(raw)
          for name,text in payload['files'].items():
              p=Path(name)
              assert p.parts[0]=='Loop' and '..' not in p.parts and not p.is_absolute()
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          exec(compile(payload['integration'],'integrate-loop-realism.py','exec'))
          shutil.copytree(Path(os.environ['RUNNER_TEMP'])/'loop-realism-assets','Loop/Resources',dirs_exist_ok=True)
          preparation=(staging/'prepare_assets.py').read_text().replace('    mae = float(np.abs(native-expected).mean())','    if native.ndim == 3 and native.shape[-1] == 4: native = native[:, :, :3]\n    if expected.ndim == 2 and native.ndim == 3: native = native[:, :, 0]\n    mae = float(np.abs(native-expected).mean())')
          Path('Loop/scripts/prepare_realism_assets.py').write_text(preparation)
          if (staging/'fixes.py').is_file(): exec(compile((staging/'fixes.py').read_text(),'realism-fixes.py','exec'))
          report=json.loads(Path('Loop/Resources/RealismAssets.json').read_text())
          assert len(report['models'])==2 and all(m['conversionValidation']=='passed' for m in report['models'])
          assert len(report['backgrounds'])==6
          PY
          mkdir -p Loop/Tests/Fixtures
          curl -fL --retry 3 'https://raw.githubusercontent.com/scikit-image/scikit-image/v0.19.3/skimage/data/astronaut.png' -o Loop/Tests/Fixtures/portrait-fixture.png
          printf '%s\n' 'Public-domain NASA portrait fixture distributed by scikit-image. Used solely for rendering tests. Source: https://scikit-image.org/docs/stable/api/skimage.data.html#skimage.data.astronaut' > Loop/Tests/Fixtures/NOTICE.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loop
          git diff --cached --name-only | tee "$RUNNER_TEMP/loop-changed-paths.txt"
          if grep -qv '^Loop/' "$RUNNER_TEMP/loop-changed-paths.txt"; then exit 1; fi
          git commit -m 'Loop 1.3.0: source-pixel portrait shaping, licensed local models and layered atmosphere'
          git push origin HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/loop-candidate-sha"
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Build native arm64 Release and verify the complete package
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(cat "$RUNNER_TEMP/loop-candidate-sha")"
          cd Loop
          bash scripts/build.sh
          bash scripts/validate.sh
          test -f Build/Device/Build/Products/Release-iphoneos/Loop.app/default.metallib
          test -d Build/Device/Build/Products/Release-iphoneos/Loop.app/LoopAging.mlmodelc
          test -d Build/Device/Build/Products/Release-iphoneos/Loop.app/LoopMatte.mlmodelc
      - name: Focused native renderer and migration tests
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          SIMULATOR=$(python3 -c 'import json,os;d=json.load(open(os.environ["RUNNER_TEMP"]+"/simulators.json"));a=[x for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"] and x.get("isAvailable")];assert a;print(a[-1]["udid"])')
          echo "$SIMULATOR" > "$RUNNER_TEMP/loop-simulator"
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          cd Loop
          xcodebuild -project Loop.xcodeproj -scheme Loop -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR" -derivedDataPath Build/Simulator -resultBundlePath Build/Realism.xcresult -parallel-testing-enabled NO -only-testing:LoopTests/RealismTests -only-testing:LoopTests/EffectsTests CODE_SIGNING_ALLOWED=NO test > Build/realism-tests.log 2>&1 || {
            python3 scripts/show_errors.py Build/realism-tests.log
            tail -160 Build/realism-tests.log
            exit 1
          }
          xcrun xcresulttool get test-results summary --path Build/Realism.xcresult --format json > Build/FOCUSED-REALISM-TESTS.json
          python3 - <<'PY'
          import json
          p='Build/FOCUSED-REALISM-TESTS.json';r=json.load(open(p));print(json.dumps(r,indent=2))
          assert r['passedTests'] >= 19 and r['failedTests']==0 and r.get('skippedTests',0)==0
          PY
          DATA=$(xcrun simctl get_app_container "$SIMULATOR" com.billy.loop data)
          cp -R "$DATA/Documents/LoopRealismChecks" Build/Realism-Samples
          test -f Build/Realism-Samples/ageOlder.png
          test -f Build/Realism-Samples/layered-rain.png
      - name: Package source and validation evidence
        run: |
          set -euo pipefail
          cd Loop
          git -C .. archive -o Loop/Build/Loop-Source.zip HEAD:Loop
          zip -qr Build/Loop-XcodeProject.zip Loop.xcodeproj
          zip -qr Build/Loop-Realism-Samples.zip Build/Realism-Samples
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png Build/Loop-Icon.png
          cp Resources/RealismAssets.json Build/REALISM-ASSET-REPORT.json
          cp docs/REALISM-RESEARCH.md Build/REALISM-RESEARCH.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Loop-1.3-Realism-Build-and-Checks
          path: |
            Loop/Build/*.ipa
            Loop/Build/*.zip
            Loop/Build/*.json
            Loop/Build/*.txt
            Loop/Build/*.log
            Loop/Build/*.png
            Loop/Build/*.md
            Loop/Build/Realism-Samples
          retention-days: 30
      - name: Publish only the compiled and renderer-checked candidate
        if: success()
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(cat "$RUNNER_TEMP/loop-candidate-sha")"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
          git checkout -B main HEAD
          cd Loop
          bash scripts/publish.sh
          gh release upload loop-1.3.0-build7 Build/FOCUSED-REALISM-TESTS.json Build/REALISM-ASSET-REPORT.json Build/REALISM-RESEARCH.md Build/Loop-Realism-Samples.zip
