name: Verify final Loop 2 editor
on:
  push:
    branches: ['feature/loop-simple-power-2.0']
    paths: ['.github/loop2-final-polish.py', '.github/loop2-final-repairs.py', '.github/workflows/loop2-final-check.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: loop2-final-check
  cancel-in-progress: true
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply final accessibility and control polish
        run: |
          set -euo pipefail
          cp .github/loop2-final-polish.py "$RUNNER_TEMP/loop2-final-polish.py"
          if [ -f .github/loop2-final-repairs.py ]; then cp .github/loop2-final-repairs.py "$RUNNER_TEMP/loop2-final-repairs.py"; fi
          git switch -c "loop/2.0-final-$GITHUB_RUN_ID" 92ef77b47d8083b330d988b388678f1d88c0154a
          python3 "$RUNNER_TEMP/loop2-final-polish.py"
          if [ -f "$RUNNER_TEMP/loop2-final-repairs.py" ]; then python3 "$RUNNER_TEMP/loop2-final-repairs.py"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Loop
          git diff --cached --name-only | tee "$RUNNER_TEMP/loop2-final-paths"
          if grep -qv '^Loop/' "$RUNNER_TEMP/loop2-final-paths"; then exit 1; fi
          git commit -m 'Loop 2.0: finish approachable subject controls and accessibility'
          git push origin HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/loop2-final-sha"
      - name: Install project generator
        run: command -v xcodegen || brew install xcodegen
      - name: Compile and verify the native iPhone release
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(cat "$RUNNER_TEMP/loop2-final-sha")"
          cd Loop
          bash scripts/build.sh
          python3 scripts/verify_release.py --binary
      - name: Compile focused checks
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cd Loop
          xcodebuild -project Loop.xcodeproj -scheme Loop -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath Build/Simulator CODE_SIGNING_ALLOWED=NO build-for-testing > Build/simulator-build.log 2>&1 || { python3 scripts/show_errors.py Build/simulator-build.log; tail -120 Build/simulator-build.log; exit 1; }
          find "$PWD/Build/Simulator/Build/Products" -maxdepth 1 -name '*.xctestrun' | head -1 > "$RUNNER_TEMP/loop2-final-testspec"
          test -s "$RUNNER_TEMP/loop2-final-testspec"
      - name: Boot iPhone simulator
        timeout-minutes: 4
        run: |
          python3 - <<'PY'
          import json,re,subprocess,os
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          keys=sorted([k for k in data['devices'] if 'iOS' in k],key=lambda k:tuple(map(int,re.findall(r'\d+',k))),reverse=True)
          devices=[x for x in data['devices'][keys[0]] if 'iPhone' in x['name'] and x.get('isAvailable')]
          chosen=next((x for x in devices if x['name']=='iPhone 17 Pro'),devices[0]);print(chosen,flush=True)
          udid=chosen['udid'];open(os.environ['RUNNER_TEMP']+'/loop2-final-simulator','w').write(udid)
          subprocess.run(['xcrun','simctl','boot',udid])
          subprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True,timeout=180)
          PY
      - name: Run model, rendering, migration and actual export checks
        timeout-minutes: 12
        run: |
          set -euo pipefail
          SIMULATOR=$(cat "$RUNNER_TEMP/loop2-final-simulator")
          SPEC=$(cat "$RUNNER_TEMP/loop2-final-testspec")
          cd Loop
          xcodebuild test-without-building -xctestrun "$SPEC" -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath Build/Creative.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -only-testing:LoopTests/CreativeTests -only-testing:LoopTests/RealismTests -only-testing:LoopTests/EffectsTests -only-testing:LoopTests/EncoderTests -only-testing:LoopTests/ExportPlanTests -only-testing:LoopTests/CreativeExportTests 2>&1 | tee Build/creative-tests.log
          xcrun xcresulttool get test-results summary --path Build/Creative.xcresult --format json > Build/FOCUSED-CREATIVE-TESTS.json
          python3 - <<'PY'
          import json,subprocess
          p='Build/FOCUSED-CREATIVE-TESTS.json';r=json.load(open(p));print(json.dumps(r,indent=2))
          assert r['passedTests']>=50 and r['failedTests']==0 and r.get('skippedTests',0)==0,r
          r['sourceCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r['scope']='Focused native scene models, masks, depth, rendering, timing, motion, encoders, project migration and actual video exports. Not the full legacy editor suite or physical-device validation.'
          open(p,'w').write(json.dumps(r,indent=2)+'\n')
          PY
      - name: Walk through the simple editor and optional advanced controls
        timeout-minutes: 10
        run: |
          set -euo pipefail
          SIMULATOR=$(cat "$RUNNER_TEMP/loop2-final-simulator")
          SPEC=$(cat "$RUNNER_TEMP/loop2-final-testspec")
          cd Loop
          xcodebuild test-without-building -xctestrun "$SPEC" -destination "platform=iOS Simulator,id=$SIMULATOR" -resultBundlePath Build/CreativeUI.xcresult -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 -only-testing:LoopUITests/CreativeUITests 2>&1 | tee Build/creative-ui.log
          xcrun xcresulttool get test-results summary --path Build/CreativeUI.xcresult --format json > Build/FOCUSED-UI-TESTS.json
          python3 - <<'PY'
          import json,subprocess
          p='Build/FOCUSED-UI-TESTS.json';r=json.load(open(p));print(json.dumps(r,indent=2))
          assert r['passedTests']>=1 and r['failedTests']==0 and r.get('skippedTests',0)==0,r
          r['sourceCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          r['scope']='Preset-first Looks, subject selection canvas and Keep/Remove controls, simple Save and optional advanced export controls. Not the full legacy editor suite or physical-device validation.'
          open(p,'w').write(json.dumps(r,indent=2)+'\n')
          PY
      - name: Collect images and diagnostics
        if: always()
        run: |
          mkdir -p Loop/Build
          if [ -f "$RUNNER_TEMP/loop2-final-simulator" ]; then
            SIM=$(cat "$RUNNER_TEMP/loop2-final-simulator")
            xcrun simctl io "$SIM" screenshot Loop/Build/Last-Simulator-Screen.png || true
            DATA=$(xcrun simctl get_app_container "$SIM" com.billy.loop data 2>/dev/null || true)
            for NAME in LoopCreativeChecks LoopRealismChecks; do
              if [ -d "$DATA/Documents/$NAME" ]; then cp -R "$DATA/Documents/$NAME" "Loop/Build/$NAME"; fi
            done
          fi
          if [ -d Loop/Build/CreativeUI.xcresult ]; then xcrun xcresulttool export attachments --path Loop/Build/CreativeUI.xcresult --output-path Loop/Build/UIScreenshots || true; fi
          for LOG in device-build simulator-build creative-tests creative-ui; do if [ -f "Loop/Build/$LOG.log" ]; then tail -120 "Loop/Build/$LOG.log"; fi; done
      - name: Package the exact tested candidate
        if: success()
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(cat "$RUNNER_TEMP/loop2-final-sha")"
          cd Loop
          python3 scripts/verify_release.py
          git -C .. archive -o Loop/Build/Loop-Source.zip HEAD:Loop
          zip -qr Build/Loop-XcodeProject.zip Loop.xcodeproj
          zip -qr Build/Loop-Creative-Samples.zip Build/LoopCreativeChecks Build/LoopRealismChecks Build/UIScreenshots
          cp Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png Build/Loop-Icon.png
          cp Resources/SceneModels/SCENE-MODELS.json Build/SCENE-MODELS.json
          cp docs/CREATIVE-RESEARCH.md Build/CREATIVE-RESEARCH.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Loop-2-Final-Candidate-and-Checks
          compression-level: 0
          path: |
            Loop/Build/*.ipa
            Loop/Build/*.zip
            Loop/Build/*.json
            Loop/Build/*.txt
            Loop/Build/*.log
            Loop/Build/*.png
            Loop/Build/*.md
            Loop/Build/LoopCreativeChecks
            Loop/Build/LoopRealismChecks
            Loop/Build/UIScreenshots
          retention-days: 30
