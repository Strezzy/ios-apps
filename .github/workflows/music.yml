name: Build and verify Music
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['MusicRepair/**', '.github/workflows/music.yml']
permissions:
  contents: write
concurrency:
  group: music-native-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Restore checksum-pinned baseline and apply repair
        run: |
          set -euo pipefail
          mkdir -p Evidence
          curl -fL --retry 3 https://github.com/Strezzy/ios-apps/releases/download/music-0.11-build12/Music-Source.zip -o /tmp/Music-Source.zip
          echo 'e476dcbcd36814e65b45e584c751c847ba0485983d142eecc304e72b6ac735f9  /tmp/Music-Source.zip' | shasum -a 256 -c -
          rm -rf Music
          unzip -q /tmp/Music-Source.zip
          python3 MusicRepair/repair.py Music
          printf 'Build-Mac/\nBuild-Probe/\nnode_modules/\n.DS_Store\n' > Music/.gitignore
      - name: Regenerate the offline renderer
        run: |
          npm install --prefix /tmp/music-tools --no-audit --no-fund esbuild@0.25.12
          MUSIC_ESBUILD_MODULE=/tmp/music-tools/node_modules/esbuild/lib/main.js node Music/Support/build_cd_renderer.mjs | tee Evidence/renderer-bundle.json
      - name: Compile the real iOS simulator and device applications
        run: |
          set -euo pipefail
          mkdir -p /tmp/RendererProbe.app
          cp -R Music/Resources/. /tmp/RendererProbe.app/
          python3 - <<'PY'
          import plistlib
          p='/tmp/RendererProbe.app/Info.plist'
          d=plistlib.load(open(p,'rb')); d['CFBundleIdentifier']='com.billy.music.rendererprobe'; d['CFBundleExecutable']='RendererProbe'; d['CFBundleSupportedPlatforms']=['iPhoneSimulator']; d.pop('UIRequiredDeviceCapabilities',None)
          d['UIApplicationSceneManifest']={'UIApplicationSupportsMultipleScenes':False,'UISceneConfigurations':{}}
          plistlib.dump(d,open(p,'wb'))
          PY
          xcrun --sdk iphonesimulator clang -arch arm64 -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" -mios-simulator-version-min=26.0 -O1 -fobjc-arc -fblocks -Wno-deprecated-declarations -framework Foundation -framework UIKit -framework AVFoundation -framework AVFAudio -framework AVKit -framework MediaPlayer -framework UniformTypeIdentifiers -framework QuartzCore -framework PhotosUI -framework ImageIO -framework CoreGraphics -framework CoreText -framework WebKit -framework CoreMotion MusicRepair/RendererProbe.m -o /tmp/RendererProbe.app/RendererProbe 2>&1 | tee Evidence/simulator-compile.log
          codesign --force --sign - /tmp/RendererProbe.app
          bash Music/build-macos.sh 2>&1 | tee Evidence/device-compile.log
          codesign --verify --deep --strict Music/Build-Mac/Payload/Music.app
      - name: Require working native CD controls and live rendering
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin);print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" /tmp/RendererProbe.app
          xcrun simctl launch --terminate-running-process --console-pty "$DEVICE" com.billy.music.rendererprobe > Evidence/runtime.log 2>&1 &
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.billy.music.rendererprobe data)
          for attempt in $(seq 1 100); do
            test ! -f "$DATA/Documents/result.json" || break
            sleep 3
          done
          sleep 3
          cp "$DATA/Documents/"*.json Evidence/ || true
          cp "$DATA/Documents/"*.png Evidence/ || true
          xcrun simctl io "$DEVICE" screenshot Evidence/Native-Inspector.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('Evidence/result.json')
          if not path.exists():
              print(Path('Evidence/runtime.log').read_text()[-12000:]); raise SystemExit('Native probe did not finish')
          result=json.loads(path.read_text()); print(json.dumps(result['checks'],indent=2))
          if not result['passed']: raise SystemExit('Native renderer regression checks failed')
          for name in ['Native-Closed.png','Native-Open.png','Native-Tilt.png','Native-Next-Album.png','Native-Player.png']:
              assert Path('Evidence',name).stat().st_size>10000, name
          PY
          xcrun simctl terminate "$DEVICE" com.billy.music.rendererprobe || true
      - name: Verify the device package and save complete source
        env:
          MUSIC_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,plistlib,shutil,struct,zipfile
          from pathlib import Path
          ipa=Path('Music/Build-Mac/Music.ipa')
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              info=plistlib.loads(z.read('Payload/Music.app/Info.plist'))
              assert info['CFBundleIdentifier']=='com.billy.glassmusic'
              assert info['CFBundleShortVersionString']=='0.12' and info['CFBundleVersion']=='13'
              binary=z.read('Payload/Music.app/'+info['CFBundleExecutable'])
              assert binary[:4]==bytes.fromhex('cffaedfe') and struct.unpack_from('<I',binary,4)[0]==0x100000c
              manifest=json.loads(z.read('Payload/Music.app/CDCase/manifest.json'))
              assert hashlib.sha256(z.read('Payload/Music.app/CDCase/music-cd.js')).hexdigest()==manifest['output']['sha256']
              for license in ['CDCase-ACKNOWLEDGMENTS.txt','Three-LICENSE.txt','Cask3-LICENSE.txt']:
                  assert z.read('Payload/Music.app/'+license)
          native=json.loads(Path('Evidence/result.json').read_text())
          report={'version':'0.12','build':'13','bundleIdentifier':info['CFBundleIdentifier'],'ipaBytes':ipa.stat().st_size,'ipaSHA256':hashlib.sha256(ipa.read_bytes()).hexdigest(),'nativeIOSSimulatorChecks':native['checks'],'nativePassed':native['passed'],'physicalDeviceTested':False,'runURL':os.environ['MUSIC_RUN_URL'],'baselineSHA256':'e476dcbcd36814e65b45e584c751c847ba0485983d142eecc304e72b6ac735f9','note':'Actual Apple SDK compilation, code signature verification and native WKWebView controls. Device gyroscope and LiveContainer installation remain physical-device tests.'}
          Path('Music/BUILD-REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('Music/README.txt').write_text('Music 0.12 (13)\n\nRepairs the CD renderer bootstrap and boolean playback bridge.\nLarger, tighter album grid. Native glass UI and existing data paths preserved.\n\nSee BUILD-REPORT.json for actual native checks and remaining device validation.\nRun bash build-macos.sh with Xcode installed to rebuild the IPA.\nOriginal renderer geometry, shaders, credits and licenses are included.\n')
          docs=Path('Music/Verification-0.12');docs.mkdir(exist_ok=True)
          for p in Path('Evidence').glob('Native-*.png'):shutil.copy2(p,docs/p.name)
          shutil.copy2('Evidence/result.json',docs/'native-result.json')
          print(json.dumps(report,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Music
          if ! git diff --cached --quiet; then
            git commit -m 'Add complete Music 0.12 source with native renderer verification'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          mkdir -p Release
          cp Music/Build-Mac/Music.ipa Release/Music.ipa
          cp Music/BUILD-REPORT.json Release/BUILD-REPORT.json
          cp Evidence/Native-*.png Release/
          python3 - <<'PY'
          import hashlib,zipfile
          from pathlib import Path
          with zipfile.ZipFile('Release/Music-Source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(Path('Music').rglob('*')):
                  if p.is_file() and not any(c in {'Build-Mac','Build-Probe','node_modules'} for c in p.parts):z.write(p,p.as_posix())
          files=sorted(p for p in Path('Release').iterdir() if p.is_file())
          Path('Release/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files))
          PY
      - name: Save checked build for release review
        uses: actions/upload-artifact@v7
        with:
          name: Music-0.12-13-Verified
          path: Release
          retention-days: 14
      - name: Save diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Music-0.12-native-evidence
          path: Evidence
          retention-days: 14
