name: Build Enter the Third Dimension (unpublished)

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: enter-third-dimension-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build the app and prove native WebGL startup
        run: python3 EnterTheThirdDimension/Support/build_ios.py
      - name: Store the verified iPhone build and source
        uses: actions/upload-artifact@v7
        with:
          name: EnterTheThirdDimension-iPhone
          path: |
            EnterTheThirdDimension/Build/EnterTheThirdDimension.ipa
            EnterTheThirdDimension/Build/EnterTheThirdDimension-Source.zip
            EnterTheThirdDimension/Build/BUILD-REPORT.json
            EnterTheThirdDimension/Build/SHA256SUMS.txt
            EnterTheThirdDimension/Build/Native-Launch.json
            EnterTheThirdDimension/Build/Simulator-Launch.png
          if-no-files-found: error
          retention-days: 30
      - name: Preserve native build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EnterTheThirdDimension-Build-Evidence
          path: |
            EnterTheThirdDimension/Build/Logs
            EnterTheThirdDimension/Build/BUILD-REPORT.json
            EnterTheThirdDimension/Build/Native-Launch.json
            EnterTheThirdDimension/Build/Simulator-Launch.png
            EnterTheThirdDimension/Build/PUBLICATION.json
          if-no-files-found: ignore
          retention-days: 14
