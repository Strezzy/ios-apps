name: Orbit
options:
  bundleIdPrefix: com.billy
  deploymentTarget:
    iOS: '26.0'
  xcodeVersion: '27.1'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_APP_INTENTS_METADATA_EXTRACTION: NO
targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Rendering
      - Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSMotionUsageDescription: Move your iPhone to look into your spatial videos with depth.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        CADisableMinimumFrameDurationOnPhone: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.video
              - public.mpeg-4
              - com.apple.quicktime-movie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.billy.orbit
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_TESTABILITY: YES
        MTL_FAST_MATH: YES
  OrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/Unit
      - path: Tests/Fixtures
        buildPhase: resources
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.billy.orbit.tests
    dependencies:
      - target: Orbit
  OrbitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UI]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.billy.orbit.uitests
        TEST_TARGET_NAME: Orbit
    dependencies:
      - target: Orbit
schemes:
  Orbit:
    build:
      targets:
        Orbit: all
    test:
      targets:
        - name: OrbitTests
          parallelizable: false
        - name: OrbitUITests
          parallelizable: false
